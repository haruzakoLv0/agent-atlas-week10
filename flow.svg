<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 880" width="820" height="880" role="img" aria-labelledby="title desc">
<title id="title">第十週 AI Agent 教學網頁 — Wiki 至 HTML 的 Loop 與 Graph</title>
<desc id="desc">先計畫、取得 5 筆資料、查核來源、Ingest、檢索、整理、品質檢查。若不通過就返回檢索，最多兩次後人工處理。通過則生成 HTML 並測試，測試不通過則返回修改；最終交付。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#7f938f" stroke-width="1.4"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#f4a669" stroke-width="1.4"/></marker></defs>
<rect width="820" height="880" rx="22" fill="#0e2c2b"/><g font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="52" y="57" fill="#a7e9d4" font-weight="700" font-size="17">WIKI → HTML / LOOP &amp; GRAPH</text><text x="52" y="92" fill="#ffffff" font-weight="700" font-size="29">有來源、有檢查、有回圈的教學流程</text>
<g fill="none" stroke="#7f938f" stroke-width="2.5" marker-end="url(#a)"><path d="M405 169V200"/><path d="M405 265V297"/><path d="M405 362V394"/><path d="M405 459V492"/><path d="M405 557V598"/><path d="M405 665V695"/><path d="M405 760V796"/></g>
<g fill="#173e3b" stroke="#5b8079" stroke-width="2"><rect x="228" y="111" width="354" height="58" rx="13"/><rect x="228" y="200" width="354" height="65" rx="13"/><rect x="228" y="297" width="354" height="65" rx="13"/><rect x="228" y="394" width="354" height="65" rx="13"/><rect x="227" y="492" width="356" height="65" rx="13"/><rect x="227" y="598" width="356" height="67" rx="13"/><rect x="227" y="695" width="356" height="65" rx="13"/></g>
<rect x="272" y="796" width="266" height="52" rx="26" fill="#77ddbb"/>
<g text-anchor="middle"><text x="405" y="136" fill="#ffffff" font-weight="700" font-size="20">① 先計畫：定義主題與章節</text><text x="405" y="157" fill="#a8c8c0" font-size="14">Plan before generate</text><text x="405" y="226" fill="#fff" font-size="20" font-weight="700">② 取得五份官方資料</text><text x="405" y="251" fill="#a8c8c0" font-size="14">保留網址、來源、查核日期</text><text x="405" y="323" fill="#fff" font-size="20" font-weight="700">③ Ingest：資料整理與索引</text><text x="405" y="348" fill="#a8c8c0" font-size="14">5 筆筆記 → 20 個知識片段</text><text x="405" y="420" fill="#fff" font-size="20" font-weight="700">④ 查 Wiki → 整理教學重點</text><text x="405" y="444" fill="#a8c8c0" font-size="14">概念、例子、引用與難度調整</text><text x="405" y="518" fill="#fff" font-size="20" font-weight="700">⑤ 品質檢查：正確嗎？</text><text x="405" y="542" fill="#a8c8c0" font-size="14">來源／概念／可理解程度</text><text x="405" y="625" fill="#fff" font-size="20" font-weight="700">⑥ 生成教學 HTML</text><text x="405" y="650" fill="#a8c8c0" font-size="14">互動、搜尋、測驗、響應式版面</text><text x="405" y="722" fill="#fff" font-size="20" font-weight="700">⑦ 網頁驗證：功能正常嗎？</text><text x="405" y="747" fill="#a8c8c0" font-size="14">開啟網頁、查詢與互動測試</text><text x="405" y="829" fill="#0e2c2b" font-size="20" font-weight="700">✓ 交付網頁與報告</text></g>
<path d="M227 524H104V426H228" stroke="#f4a669" stroke-width="2.6" fill="none" marker-end="url(#b)"/><text x="54" y="475" fill="#f4bd97" font-size="17" font-weight="700">不通過</text><text x="54" y="496" fill="#f4bd97" font-size="14">返回查詢</text><text x="425" y="583" fill="#77ddbb" font-size="15">通過 ↓</text><path d="M583 725H685V635H584" stroke="#f4a669" stroke-width="2.5" fill="none" marker-end="url(#b)"/><text x="592" y="688" fill="#f4bd97" font-size="15">測試失敗</text><text x="592" y="707" fill="#f4bd97" font-size="13">修正 HTML</text><path d="M103 523V558" stroke="#f4a669" stroke-width="1.7" fill="none" stroke-dasharray="5 5"/><text x="23" y="579" fill="#f4bd97" font-size="14">最多重試 2 次，</text><text x="23" y="599" fill="#f4bd97" font-size="14">仍未通過 → 人工檢查</text><text x="423" y="788" fill="#77ddbb" font-size="15">通過 ↓</text></g></svg>
